name: Preparar CICLO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir CICLO1-clean
        run: |
          unzip -o CICLO1-clean.zip -d /tmp/ciclo
          cp -r /tmp/ciclo/* .
          rm -f CICLO1-clean.zip

      - name: Guardar proyecto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Preparar CICLO para despliegue"
          git push
